name: Release

# Publishes the GitHub release for the version in plugin.yaml, once.
# It runs when a release-notes file lands on main (.github/release-notes/<version>.md) and can be
# started by hand. It does nothing when the notes file is missing or the release already exists.
# Otherwise it builds the archive with build_release.py, runs the backend tests on the extracted
# archive on Windows, creates tag v<version> on this commit, and attaches the archive, its
# SHA-256 and a gates file.
on:
  push:
    branches: [main]
    paths: ['.github/release-notes/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Decide whether to release
        id: plan
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}\r\{0,1\}$/\1/p' plugin.yaml)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "NOTES=.github/release-notes/$version.md" >> "$GITHUB_ENV"
          if [ ! -f ".github/release-notes/$version.md" ]; then
            echo "No .github/release-notes/$version.md; nothing to release."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version from $GITHUB_SHA."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.go == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check every version string matches plugin.yaml
        if: steps.plan.outputs.go == 'true'
        run: |
          python -m pip install -q -r requirements-test.lock
          python -m pytest tests/test_version_consistency.py -q -p no:cacheprovider
      - name: Build the archive
        if: steps.plan.outputs.go == 'true'
        run: python build_release.py --output out
      - name: Run the backend tests on the extracted archive
        if: steps.plan.outputs.go == 'true'
        run: |
          mkdir extracted
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "out/account-switcher-$VERSION.zip" extracted
          python -m pip install -q -r extracted/requirements-test.lock
          cd extracted
          python -m pytest tests -q -p no:cacheprovider | tee ../pytest.txt
      - name: Write the gates file
        if: steps.plan.outputs.go == 'true'
        run: |
          python - <<'PY'
          import json, os, re, zipfile
          v = os.environ['VERSION']
          archive = f'out/account-switcher-{v}.zip'
          summary = open('pytest.txt', encoding='utf-8').read().strip().splitlines()[-1]
          passed = int(re.search(r'(\d+) passed', summary).group(1))
          gates = {
              'what': f'Release gates on the exact {v} archive, run by the Release workflow on GitHub Actions (windows-latest).',
              'archive': os.path.basename(archive),
              'archive_sha256': open(archive[:-4] + '.sha256').read().split()[0],
              'archive_files': len(zipfile.ZipFile(archive).namelist()),
              'public_commit': os.environ['GITHUB_SHA'],
              'automated_tests': {'backend_on_the_extracted_archive': passed, 'pytest_summary': summary},
              'workflow_run': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          with open(f'out/release-{v}-gates.json', 'w', encoding='utf-8') as f:
              json.dump(gates, f, indent=1)
              f.write('\n')
          print(json.dumps(gates, indent=1))
          PY
      - name: Publish the release
        if: steps.plan.outputs.go == 'true'
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Hermes Account Switcher $VERSION" --notes-file "$NOTES" \
            "out/account-switcher-$VERSION.zip" "out/account-switcher-$VERSION.sha256" "out/release-$VERSION-gates.json"
