name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-windows:
    # The plugin targets Windows, so this is the job that counts: it runs every backend test.
    name: Backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pytest tests -q -rs

  backend-linux:
    # Fast check that the portable code stays portable; tests marked "windows" are skipped here.
    name: Backend tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pytest tests -q -rs

  interface:
    name: Interface tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
